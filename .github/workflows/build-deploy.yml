name: Build & Deploy FRP Panel

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Superseded main-branch pushes do not need to consume runners. Manual/tag
# production deployments use a different group and are never cancelled here.
concurrency:
  group: frp-panel-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  go-checks:
    name: Go vet + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare upstream test prerequisites
        run: |
          mkdir -p cmd/frpp/out
          echo "placeholder" > cmd/frpp/out/.gitkeep
          sudo mkdir -p /home/coder/code/frp-panel/tmp/workerd /home/coder/go/bin
          sudo chmod -R 777 /home/coder

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./... -count=1

  deploy-script-tests:
    name: Deploy scripts offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate deployment baseline
        run: bash deploy/tests/validate-baseline.sh

      - name: Backup / rollback offline suite
        # T05 now selects a deliberately missing sqlite3 command via
        # FRP_PANEL_SQLITE3_BIN, so the suite is deterministic even though
        # ubuntu-latest preinstalls sqlite3. No throwaway container or apt is
        # needed.
        run: bash deploy/tests/test-backup-rollback.sh

  frontend:
    name: Build frontend once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore exact frontend output
        id: frontend-output-cache
        uses: actions/cache@v6
        with:
          path: cmd/frpp/out
          key: frontend-output-v1-${{ hashFiles('www/**') }}

      - name: Set up pnpm
        if: steps.frontend-output-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.0
          run_install: false

      - name: Set up Node
        if: steps.frontend-output-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: www/pnpm-lock.yaml

      - name: Restore Next.js incremental cache
        if: steps.frontend-output-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: www/.next/cache
          key: next-v1-${{ runner.os }}-${{ hashFiles('www/pnpm-lock.yaml') }}-${{ hashFiles('www/**/*.ts', 'www/**/*.tsx', 'www/**/*.js', 'www/**/*.css', 'www/**/*.json') }}
          restore-keys: |
            next-v1-${{ runner.os }}-${{ hashFiles('www/pnpm-lock.yaml') }}-

      - name: Install frontend dependencies
        if: steps.frontend-output-cache.outputs.cache-hit != 'true'
        working-directory: www
        run: pnpm install --frozen-lockfile

      - name: Build frontend and typecheck
        if: steps.frontend-output-cache.outputs.cache-hit != 'true'
        working-directory: www
        # Next.js build performs TypeScript checking, then package.json copies
        # the static export to cmd/frpp/out for Go embed.
        run: pnpm build

      - name: Verify embedded frontend
        run: test -f cmd/frpp/out/index.html

      - name: Upload embedded frontend
        uses: actions/upload-artifact@v7
        with:
          name: frp-panel-frontend
          path: cmd/frpp/out
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build linux/${{ matrix.goarch }}
    needs: frontend
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download embedded frontend
        uses: actions/download-artifact@v8
        with:
          name: frp-panel-frontend
          path: cmd/frpp/out

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build linux/${{ matrix.goarch }}
        env:
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          # 版本号注入：tag 构建用 tag 名，非 tag（workflow_dispatch）用 dev-<短 sha>，
          # 这样 WebUI 侧边栏显示的版本永远对应真实构建来源。
          case "$REF" in
            v*) VERSION="$REF" ;;
            *)  VERSION="dev-$(echo "$COMMIT" | cut -c1-7)" ;;
          esac
          echo "注入版本: $VERSION"
          LDFLAGS="-s -w"
          LDFLAGS="$LDFLAGS -X github.com/VaalaCat/frp-panel/conf.gitVersion=$VERSION"
          LDFLAGS="$LDFLAGS -X github.com/VaalaCat/frp-panel/conf.gitCommit=$COMMIT"
          LDFLAGS="$LDFLAGS -X github.com/VaalaCat/frp-panel/conf.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="$LDFLAGS" \
            -o frp-panel-linux-${{ matrix.goarch }} ./cmd/frpp

      - name: Upload linux/${{ matrix.goarch }} binary
        uses: actions/upload-artifact@v7
        with:
          name: frp-panel-linux-${{ matrix.goarch }}
          path: frp-panel-linux-${{ matrix.goarch }}
          if-no-files-found: error
          # GitHub Free 只有 500 MB 制品额度，三个二进制约 114 MB/次。
          # deploy-master 与 release 都在本次 run 内消费，1 天足够；
          # 用默认 7 天会在连打几次 tag 后再次撑爆配额。
          # 代价：超过 24h 后再 re-run 这个 run 需要重新构建。
          retention-days: 1

  deploy-master:
    name: Deploy Master (Aliyun ECS)
    needs: [go-checks, deploy-script-tests, build]
    if: >-
      ${{
        needs.go-checks.result == 'success' &&
        needs.deploy-script-tests.result == 'success' &&
        needs.build.result == 'success' &&
        ((github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')) ||
         github.event_name == 'workflow_dispatch')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: frp-panel-production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: frp-panel-linux-*
          path: dist
          merge-multiple: true

      - name: Prepare deployment bundle
        run: |
          test -f dist/frp-panel-linux-amd64
          mkdir -p deploy-bundle
          cp dist/frp-panel-linux-amd64 deploy-bundle/frp-panel-linux-amd64
          cp deploy/ci-deploy-master.sh deploy-bundle/ci-deploy-master.sh

      - name: Upload binary + deploy script
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy-bundle/*
          target: /opt/frp-panel/bin
          strip_components: 1

      - name: Run deploy script via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: MASTER_GLOBAL_SECRET,MASTER_API_HOST
          script: |
            chmod +x /opt/frp-panel/bin/ci-deploy-master.sh
            mv /opt/frp-panel/bin/frp-panel-linux-amd64 /opt/frp-panel/bin/frp-panel.new
            bash /opt/frp-panel/bin/ci-deploy-master.sh ${{ github.ref_name }}
        env:
          MASTER_GLOBAL_SECRET: ${{ secrets.MASTER_GLOBAL_SECRET }}
          MASTER_API_HOST: ${{ secrets.MASTER_API_HOST }}

  release:
    name: Release binaries (v*)
    needs: [go-checks, deploy-script-tests, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download embedded frontend
        uses: actions/download-artifact@v8
        with:
          name: frp-panel-frontend
          path: cmd/frpp/out

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build windows/amd64
        env:
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          case "$REF" in
            v*) VERSION="$REF" ;;
            *)  VERSION="dev-$(echo "$COMMIT" | cut -c1-7)" ;;
          esac
          echo "注入版本: $VERSION"
          LDFLAGS="-s -w"
          LDFLAGS="$LDFLAGS -X github.com/VaalaCat/frp-panel/conf.gitVersion=$VERSION"
          LDFLAGS="$LDFLAGS -X github.com/VaalaCat/frp-panel/conf.gitCommit=$COMMIT"
          LDFLAGS="$LDFLAGS -X github.com/VaalaCat/frp-panel/conf.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags="$LDFLAGS" \
            -o frp-panel-windows-amd64.exe ./cmd/frpp

      - name: Download linux binaries
        uses: actions/download-artifact@v8
        with:
          pattern: frp-panel-linux-*
          path: dist
          merge-multiple: true

      - name: Stage release files with version
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p release-files
          cp dist/frp-panel-linux-amd64 "release-files/frp-panel-${VERSION}-linux-amd64"
          cp dist/frp-panel-linux-arm64 "release-files/frp-panel-${VERSION}-linux-arm64"
          cp frp-panel-windows-amd64.exe "release-files/frp-panel-${VERSION}-windows-amd64.exe"
          (cd release-files && sha256sum * > checksums.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-files/*
