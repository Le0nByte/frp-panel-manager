# Replace certificate paths only after Certbot validation has passed.
server {
    listen 9443 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/frp-panel/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frp-panel/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/frp-panel;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
