# Replace certificate paths only after Certbot validation has passed.
server {
    listen 9443 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/frp-panel/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frp-panel/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/frp-panel;
        default_type text/plain;
        try_files $uri =404;
    }

    # 实时日志走 SSE（/api/v1/log）。nginx 默认 proxy_buffering on 会把低频
    # 事件流全部吞进缓冲区，浏览器一帧都收不到，表现为"实时日志什么都没有"。
    # 后端已发 X-Accel-Buffering: no（那一层就够），这里再显式关一次做双保险，
    # 并把读超时拉长，避免空闲 60s 被 nginx 掐断。
    location = /api/v1/log {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
